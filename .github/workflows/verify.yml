name: Reproduce and verify analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce preliminary analysis
        run: python analysis/preliminary_analysis.py
      - name: Independently verify results
        run: python analysis/verify_results.py
